  <!-- Firebase compat SDK (for dynamic grade cards) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script src="firebase-config.js"></script>
    <script src="/script.js"></script>
    <script src="js/lightgallery.min.js"></script>

    <!-- lightgallery plugins -->
    <script src="js/plugins/lg-thumbnail.umd.js"></script>
    <script src="js/plugins/lg-zoom.umd.js"></script>

  <script>
    // Load additional grade levels from Firestore
    async function loadDynamicGrades() {
      try {
        const snap = await db.collection('gallery_grades').orderBy('order').get().catch(() =>
          db.collection('gallery_grades').get()
        );
        if (snap.empty) return;
        const boxes = document.querySelector('.boxes');
        snap.docs.forEach(doc => {
          const g = doc.data();
          const div = document.createElement('div');
          div.className = 'box';
          const pageUrl = g.custom_url || `gallery-dynamic.html?grade=${g.slug}`;
          div.innerHTML = `
            <div class="grade-page-gallery">
              ${g.cover_image
                ? `<img class="grade-page-img" src="${g.cover_image}" alt="${g.name}">`
                : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#9d6a47;font-size:3rem;"><i class="fa-solid fa-images"></i></div>`
              }
            </div>
            <button class="mira-gallery-btn"><a href="${pageUrl}">${g.name}</a></button>`;
          boxes.appendChild(div);
        });
      } catch(e) {
        console.log('Could not load dynamic grades:', e.message);
      }
    }
    loadDynamicGrades();
  </script>
</body>
</html>
